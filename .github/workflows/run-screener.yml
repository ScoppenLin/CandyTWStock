name: Run Taiwan Stock Screener

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "output/**"
      - "logs/**"

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run screener
        run: python screener.py

      - name: Add run summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import pandas as pd
          from pathlib import Path

          result_path = Path("output/screening_result.csv")
          error_path = Path("logs/error_log.csv")

          print("## Taiwan Stock Screener Output")
          if result_path.exists():
              result = pd.read_csv(result_path)
              print(f"- Screening rows: {len(result)}")
              print(f"- CSV: `output/screening_result.csv`")
              print(f"- Excel: `output/screening_result.xlsx`")
              print(f"- Strict candidates: `output/strict_candidates.xlsx`")
              print(f"- Watchlist candidates: `output/watchlist_candidates.xlsx`")
              if not result.empty:
                  print("")
                  print("### Top rows")
                  print("```csv")
                  print(result.head(10).to_csv(index=False))
                  print("```")
              else:
                  print("")
                  print("No stock matched the current filters.")
          else:
              print("- Screening result was not generated.")

          if error_path.exists():
              errors = pd.read_csv(error_path)
              print(f"- Error log rows: {len(errors)}")
              if not errors.empty:
                  print("")
                  print("### Recent errors")
                  print("```csv")
                  print(errors.tail(10).to_csv(index=False))
                  print("```")
          PY

      - name: Upload screening outputs
        uses: actions/upload-artifact@v4
        with:
          name: screening-output
          path: |
            output/
            logs/

      - name: Commit screening outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/screening_result.csv output/screening_result.xlsx output/strict_candidates.xlsx output/watchlist_candidates.xlsx logs/error_log.csv data/stock_list.csv
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Update screening output [skip ci]"
            git push
          fi
