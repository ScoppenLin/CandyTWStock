name: Run Taiwan Stock Screener

on:
  workflow_dispatch:
  schedule:
    # Taiwan market closes at 13:30 Asia/Taipei. This runs at 18:00 Taipei time on weekdays.
    - cron: "0 10 * * 1-5"
  push:
    branches:
      - main
    paths-ignore:
      - "output/**"
      - "logs/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run-screener:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run screener
        run: python screener.py

      - name: Add run summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import pandas as pd
          from pathlib import Path

          result_path = Path("output/screening_result.csv")
          error_path = Path("logs/error_log.csv")

          print("## Taiwan Stock Screener Output")
          if result_path.exists():
              result = pd.read_csv(result_path)
              print(f"- Screening rows: {len(result)}")
              print(f"- CSV: `output/screening_result.csv`")
              print(f"- Excel: `output/screening_result.xlsx`")
              print(f"- Strict candidates: `output/strict_candidates.xlsx`")
              print(f"- Watchlist candidates: `output/watchlist_candidates.xlsx`")
              print(f"- HTML dashboard: `output/candidates.html`")
              if not result.empty:
                  print("")
                  print("### Top rows")
                  print("```csv")
                  print(result.head(10).to_csv(index=False))
                  print("```")
              else:
                  print("")
                  print("No stock matched the current filters.")
          else:
              print("- Screening result was not generated.")

          if error_path.exists():
              errors = pd.read_csv(error_path)
              print(f"- Error log rows: {len(errors)}")
              if not errors.empty:
                  print("")
                  print("### Recent errors")
                  print("```csv")
                  print(errors.tail(10).to_csv(index=False))
                  print("```")
          PY

      - name: Upload screening outputs
        uses: actions/upload-artifact@v4
        with:
          name: screening-output
          path: |
            output/
            logs/

      - name: Prepare GitHub Pages site
        run: |
          mkdir -p public/downloads
          cp output/candidates.html public/index.html
          cp output/screening_result.csv public/downloads/screening_result.csv
          cp output/screening_result.xlsx public/downloads/screening_result.xlsx
          cp output/strict_candidates.xlsx public/downloads/strict_candidates.xlsx
          cp output/watchlist_candidates.xlsx public/downloads/watchlist_candidates.xlsx
          cp logs/error_log.csv public/downloads/error_log.csv

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit screening outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/screening_result.csv output/screening_result.xlsx output/strict_candidates.xlsx output/watchlist_candidates.xlsx output/candidates.html logs/error_log.csv data/stock_list.csv
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Update screening output [skip ci]"
            git push
          fi

      - name: Send email notification
        if: always()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_TO: huiju999@yahoo.com.tw,scoppen.lin@gmail.com
          CANDY_STOCK_SITE_URL: https://scoppenlin.github.io/CandyTWStock/
        run: python notify_email.py
